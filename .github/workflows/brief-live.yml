name: brief-live

# Server-side data for the Morning Brief panel: weather, AAPL and car listings.
# GitHub runs cron hours late on this account, so a brief update from the hourly
# routine or the Mac also starts this job. Its own commits use GITHUB_TOKEN and
# never retrigger it.
on:
  schedule:
    - cron: '17 14-23,0-6 * * *'
  push:
    # claude/brief-export: the cloud "Hub brief export" routine pushes brief.json there when
    # it can't push to main; the job below copies it across.
    branches: [main, claude/brief-export]
    paths: ['private.enc.json', 'brief.json', 'scripts/ballot_results.py']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: brief-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Take brief.json from the export branch
        continue-on-error: true
        run: |
          git fetch origin claude/brief-export || exit 0
          git show FETCH_HEAD:brief.json > /tmp/brief.json || exit 0
          # Only a valid, newer brief replaces the one on main.
          python -I - <<'PY'
          import json, shutil
          new, old = json.load(open("/tmp/brief.json")), json.load(open("brief.json"))
          if isinstance(new.get("cars"), list) and str(new.get("updated", "")) > str(old.get("updated", "")):
              shutil.copy("/tmp/brief.json", "brief.json")
              print("brief.json taken from claude/brief-export")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I scripts/brief_live.py
        env:
          # Tracking numbers stay out of this public repo; see parcels() in the script.
          PARCELS: ${{ secrets.PARCELS }}
      - name: Ballot results (through the Nov 2026 count)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          [ "$(TZ=America/Los_Angeles date +%Y%m%d)" -le 20261120 ] || exit 0
          python -I scripts/ballot_results.py --csv ballot.csv
      - name: Commit live.json
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json brief.json
          [ -f ballot.csv ] && git add ballot.csv
          git diff --cached --quiet && exit 0
          git commit -m "live: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
