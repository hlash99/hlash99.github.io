name: brief-live

# Server-side data for the Morning Brief panel: weather, AAPL and car listings.
# GitHub runs cron hours late on this account, so a brief update from the hourly
# routine or the Mac also starts this job. Its own commits use GITHUB_TOKEN and
# never retrigger it.
on:
  schedule:
    - cron: '17 14-23,0-6 * * *'
  push:
    branches: [main]
    paths: ['private.enc.json', 'brief.json', 'scripts/ballot_results.py']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: brief-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I scripts/brief_live.py
      - name: Ballot results (through the Nov 2026 count)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          [ "$(TZ=America/Los_Angeles date +%Y%m%d)" -le 20261120 ] || exit 0
          python -I scripts/ballot_results.py --csv ballot.csv
      - name: Commit live.json
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          [ -f ballot.csv ] && git add ballot.csv
          git diff --cached --quiet && exit 0
          git commit -m "live: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
